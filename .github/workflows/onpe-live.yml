name: ONPE live snapshot

on:
  schedule:
    - cron: "*/5 * * * *"   # cron minimo de GitHub; el bucle interno cubre el hueco
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: onpe-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4   # rama default = gh-pages (el propio sitio)

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Poll ONPE ~4.5 min (push apenas cambian los datos)
        run: |
          git config user.name "onpe-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          END=$((SECONDS+260))
          while [ $SECONDS -lt $END ]; do
            node .github/scripts/onpe-snapshot.mjs snapshot || true
            git add snapshot
            if git diff --cached --quiet; then
              echo "$(date -u +%T) sin cambios"
            else
              git commit -m "snapshot ONPE $(date -u +%FT%TZ)"
              git pull --rebase origin gh-pages || true
              git push origin gh-pages || true
            fi
            sleep 40
          done
